[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "imu-vive-learning"
version = "0.2.0"
description = "Leakage-safe preparation and evaluation of the AlphaF four-IMU endpoint dataset"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
eval = [
  "scikit-learn>=1.9,<1.10",
  "xgboost>=3.3,<3.4",
  "scipy>=1.17,<1.18",
  "matplotlib>=3.11,<3.12",
  "joblib>=1.5,<1.6",
  "threadpoolctl>=3.6,<3.7",
]
dev = [
  "pytest>=8.3,<10",
]

[project.scripts]
imu-vive-mlprep = "imu_vive_learning.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
