  empirical_row_count_weighting_across_training_scenarios_allowed: false
  mask_law:
    full: 0.25
    outage_humerus: 0.1875
    outage_radius: 0.1875
    outage_carpus: 0.1875
    outage_digitus: 0.1875
  direct_erm_formula: 0.25_R_full_plus_0.1875_times_sum_of_four_outage_R
