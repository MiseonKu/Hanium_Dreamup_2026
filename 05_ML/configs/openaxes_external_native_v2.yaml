cagrad:
  applies_only_to_candidate: sensor_experts_6979__scenario_balanced_cagrad
  coefficient_c: 0.4
  full_task_role: outside_outage_solver
  outage_task_order:
    - outage_humerus
    - outage_radius
    - outage_carpus
    - outage_digitus
  task_gradient_definition: gradient_of_corresponding_scenario_balanced_view_risk
  trainable_parameter_vector_order: module_named_parameters_declaration_order
  task_gradient_dtype: float32
  gram_matrix_dtype: float64
  gram_matrix_formula: cast_each_fixed_float32_gradient_to_float64_then_row_order_and_reductions_fixed_float64_dot
  gram_symmetrization: half_times_G_plus_G_transpose
  uniform_reference_weights: [0.25, 0.25, 0.25, 0.25]
  mean_outage_gradient_formula: one_fourth_sum_of_four_outage_gradients
  solver:
    library: scipy.optimize.minimize
    method: SLSQP
    decision_variable_order: outage_task_order
    initial_weights: [0.25, 0.25, 0.25, 0.25]
    bounds_each_weight: [0.0, 1.0]
    equality_constraint: sum_weights_equals_1
    objective: dot_weighted_outage_gradient_with_mean_outage_gradient_plus_c_times_norm_mean_times_norm_weighted
    objective_evaluation: explicit_float64_gradient_matrix_weighted_vector_with_fixed_reductions_and_fixed_euclidean_norm
    objective_gram_form_diagnostic_identity: wT_G_u_plus_c_times_sqrt_uT_G_u_times_sqrt_wT_G_w
    analytic_jacobian: G_u_plus_c_times_sqrt_uT_G_u_times_G_w_divided_by_sqrt_wT_G_w
    zero_weighted_gradient_subgradient: G_u
    constraint_representation: scipy_equality_mapping_fun_sum_minus_one_with_float64_ones_jacobian
    top_level_tol_argument_omitted: true
    maxiter: 100
    ftol: 1.0e-12
    solver_display: false
    one_solver_start_only: true
    success_flag_required: true
    finite_objective_weights_and_jacobian_required: true
    equality_absolute_residual_max: 1.0e-10
    bound_absolute_violation_max: 1.0e-10
    returned_weights_are_not_clipped_renormalized_or_reoptimized: true
    failure_or_nonconvergence_policy: fail_closed_no_fallback
  epsilon: 1.0e-12
  cagrad_outage_direction_formula: g_mean_plus_c_times_norm_g_mean_times_g_weighted_divided_by_norm_g_weighted_plus_epsilon
  final_gradient_formula: 0.25_times_g_full_plus_0.75_times_cagrad_outage_direction
  direction_arithmetic: cast_all_five_fixed_float32_gradients_to_float64_form_direction_with_fixed_reductions_then_cast_once_to_float32_parameter_grad
  post_assembly_norm_rescaling_or_clipping_allowed: false
  missing_none_or_nonfinite_task_gradient_policy: fail_closed
  degenerate_norms_solver_weights_objective_residual_and_direction_norms_recorded_each_update: true

