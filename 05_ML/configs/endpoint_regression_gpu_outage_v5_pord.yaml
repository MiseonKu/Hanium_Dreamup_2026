  v3_checkpoint_reference_schema: path_bytes_sha256_tensor_count_exact
  v3_checkpoint_npz_validation: positive_exact_tensor_count_nonempty_names_numeric_finite
  no_new_collection: true

data_roles:
  development_segments: [36, 37, 38, 39]
  development_rows: 6635
  development_segment_rows: [1672, 1597, 1707, 1659]
  challenge_segments: [40, 41]
  challenge_rows: 3295
  challenge_segment_rows: [1672, 1623]
  challenge_forced_outage_index: 1
  challenge_forced_outage_sensor: imu1_link_root
  challenge_availability: [1, 0, 1, 1]
  segment_41_role: primary_previously_unused_same_session_diagnostic
  segment_40_role: secondary_previously_observed_same_session_diagnostic
  same_collection_session: true
  no_synthetic_or_new_rows: true

task:
  sensor_feature_view: fusion_v1
  encoder_delta_feature_count: 3
  imu_count: 4
  per_imu_feature_count: 10
  sensor_feature_count: 43
  availability_feature_count: 4
  model_input_feature_count: 47
  unavailable_sensor_imputation: exact_zero_after_train_only_standardization
  availability_features_are_raw_binary: true
  segment_is_model_input: false
  target_transform: train_xyz_mean_and_one_isotropic_scale_repeated_three_times_at_api
  prediction_space: inverse_transformed_vive_world_xyz_mm
  supervised_label_source: vive_only
  inference_forbidden_tokens: [vive, tracker, planned, target_id, segment, timestamp, qc, provenance]

views:
  names: [full, drop_imu0, drop_imu1, drop_imu2, drop_imu3]
  probabilities: [0.25, 0.1875, 0.1875, 0.1875, 0.1875]
  availability:
    - [1, 1, 1, 1]
    - [0, 1, 1, 1]
    - [1, 0, 1, 1]
    - [1, 1, 0, 1]
    - [1, 1, 1, 0]
  constant_availability_negative_control: [1, 1, 1, 1]
  constant_availability_still_zero_masks_continuous_imu_block: true
  materialization: exact_full_plus_four_views_for_every_uid_after_split
  fit_preprocessor_on_complete_unreplicated_train_rows_only: true
  empirical_group_means_use_full_fold_each_epoch: true

backbones:
  primary:
    backbone_id: masked_mlp_64x64_relu
    methods: [full_gradient_only_mask_selected_control, masked_erm, constant_availability_erm, group_mean_pord, paired_tail, paired_interaction, paired_pord, paired_wrong_pair, paired_no_stopgrad, groupdro, vrex, mofe]
    hidden_layer_sizes: [64, 64]
    activation: ReLU
    reconstruction_loss_weight: 0.0
  transfer:
    backbone_id: chain_endpoint_only
    methods: [masked_erm, paired_pord]
    width: 96
    depth: 4
    expansion: 2
    activation: SiLU
    normalization: LayerNorm
    dropout: 0.0
    reconstruction_loss_weight: 0.0

methods:
  controlled_primary_order: [full_gradient_only_mask_selected_control, masked_erm, constant_availability_erm, group_mean_pord, paired_tail, paired_interaction, paired_pord, paired_wrong_pair, paired_no_stopgrad, groupdro, vrex, mofe]
  transfer_order: [masked_erm, paired_pord]
  full_gradient_only_mask_selected_control: full_view_gradient_only_with_same_outage_based_train_only_checkpoint_selection_not_a_no_mask_pipeline
  constant_availability_erm: physical_outage_zero_mask_with_all_four_availability_bits_fixed_one_in_train_checkpoint_and_outer
  group_mean_pord_terms: [mask_risk, fixed_symmetric_positive_top3_group_mean_excess, mean_absolute_two_way_group_mean_interaction]
  group_mean_excess: missing_group_risk_minus_detached_full_group_risk_not_pair_specific
  paired_atom: segment_mean_of_row_relu_missing_loss_minus_full_reference_loss
  paired_relu_order: relu_before_segment_mean
  paired_pord_terms: [mask_risk, fixed_symmetric_positive_top3_paired_atoms, mean_absolute_two_way_paired_atom_interaction]
  correct_pairing: same_trial_uid_full_reference
  wrong_pairing: sorted_trial_uid_within_segment_circular_derangement_shift_one
  wrong_pairing_preserves_full_loss_marginal: true
  wrong_pairing_has_no_self_pair: true
  wrong_pairing_map_and_hash_frozen_before_training: true
  wrong_pair_evidence_is_bounded_to_one_preregistered_map: true
  no_general_claim_over_all_derangements: true
  paired_no_stopgrad_forward_equals_paired_pord: true
  paired_no_stopgrad_only_intended_difference: full_reference_gradient
  tail_atom_count: 12
  tail_top_k: 3
  tail_cutoff_ties: symmetric_subgradient
  interaction: two_way_centered_paired_positive_atoms
  relu_and_abs_zero_subgradient: 0.0
  groupdro_eta: 0.01
  groupdro_prior_full_atom_weight: 0.08333333333333333
  groupdro_prior_missing_atom_weight: 0.0625
  vrex_beta: 1.0
  vrex_variance: population_weighted_group_variance
  mofe_lambda: 0.1
  mofe_hinge: per_row_relu_full_loss_minus_missing_loss

splits:
  held_out_segment_policy: leave_one_development_segment_out
  held_out_segments: [36, 37, 38, 39]
  paired_seed_values: [20260824, 20260825, 20260826]
  paired_initialization_required_within_backbone_seed_fold: true
  exact_fit_rows: 14
  exact_fit_count: 168
  outage_contexts_primary: 192
  outage_contexts_transfer: 32
  outage_contexts_total: 224
  full_contexts_total: 56
  row_positive_excess_summaries: 672

training:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.001
  update_budget: 400
  updates_per_epoch: 1
  early_checkpoint_criterion: training_segments_only_half_mean_four_outage_rmse_plus_half_max_four_outage_rmse
  earliest_tie_checkpoint: true
  checkpoint_selection_scope: training_segments_only
  outer_labels_read_before_checkpoint_fixed: false
  outer_eval_count_per_fit: 1
  outer_evaluation_timing: exactly_once_after_checkpoint_fixed
  one_checkpoint_predicts_all_four_outages: true
  one_checkpoint_predicts_full: true
  nonfinite_action: fail_closed
  missing_artifact_action: fail_closed

execution:
  production_mode: production_cuda_spawn
  private_test_mode: synthetic_test_only
  synthetic_artifacts_rejected_by_production_handoff: true
  gpu_count: 4
  workers_per_gpu_min: 1
  workers_per_gpu_max: 3
  workers_per_gpu_is_execution_only: true
