  trainer_outer_array_surface: absent
  outer_nonuse_enforcement: code_order_and_durable_phase_receipts
  standalone_validators_are_pure_nonmutating: true
  recovery_mutation_route: explicit_resume_execution_only
  single_controller_no_concurrent_parent_finalizer_assumption: true
  machine_enforced_cross_parent_finalizer_mutex: false
  parent_challenge_markers_checked_before_and_after_label_load: true
  parquet_arrow_dtype_contract: string_int64_float64_exact_no_narrowing_or_coercion
  parquet_arrow_field_nullability: nullable_true_exact
  parquet_schema_metadata: exact_single_canonical_pandas_metadata_bytes
  parquet_metadata_version_policy: exact_locked_runtime_pyarrow_and_pandas_versions
  quarantine_is_nondelete_evidence_preservation_not_refit_authority: true
  started_only_challenge_marker_action: fail_closed
  python: "3.12"

aggregation:
  context_prediction: arithmetic_mean_of_three_paired_seed_predictions
  score_name: outage_robust_j_mm
  score_formula: "(mean_rmse_over_16_contexts_mm + worst_segment_mean_rmse_over_4_outages_mm + worst_sensor_mean_rmse_over_4_segments_mm) / 3"
  exact_v3_scoring_semantics: true
  numeric_equality_abs_tolerance_mm: 1.0e-12
  nonfinite_context_score: positive_infinity
  missing_context_action: fail_closed_before_scoring
  row_positive_excess: max_outage_3d_error_minus_full_3d_error_and_zero
  row_positive_excess_summaries: [mean_mm, p95_mm, max_mm, positive_fraction]
  v3_full_baseline_replay_checkpoint_outage_index: 1
  v3_full_baseline_seed_ensemble_count_per_fold: 3
  full_score_formula: "0.5 * (mean_heldout_full_rmse_3d_mm + max_heldout_full_rmse_3d_mm)"

