  strict_task_result_checkpoint_history_prediction_bindings: true
  strict_source_environment_gpu_uuid_pci_bindings: true
  resultless_complete_bundle_resume: authenticate_and_reconstruct_without_source_reread_or_refit
  task_phase_order: [execution.started, training.completed, outer_prediction.completed, outer_eval.started, outer_eval.completed, bundle.completed, result]
  authenticated_unique_scientific_fit_count: 168
  execution_started_without_training_completed: fail_closed_no_refit
  training_completed_resume: continue_from_authenticated_checkpoint_without_refit
  outer_eval_started_without_completed: fail_closed_no_second_evaluation
  outer_eval_completed_resume: authenticate_persisted_phase_receipt_and_predictions_without_truth_source_read_or_evaluator_call
  resultless_phase_recovery: authenticate_phase_payloads_without_repeat_fit_or_repeat_completed_evaluation
