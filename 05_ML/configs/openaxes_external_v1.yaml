folds:
  total_declared_outer_folds: 14
  families:
    - id: scenario_loso
      expected_folds: 8
      test_group: one_complete_scenario
      role: primary
    - id: speed_pair_out
      expected_folds: 4
      test_group: both_shapes_at_one_complete_speed
      role: stress
    - id: shape_out
      expected_folds: 2
      test_group: all_speeds_of_one_complete_shape
      role: stress
  inner_selection: scenario_blocked_training_groups_only
  outer_test_fitting_allowed: false
  row_random_split_allowed: false
  repeated_loops_are_independent_folds: false

limitations:
  physical_recording_sessions: 1
  effective_scenario_clusters: 8
  same_installation: true
  same_sensor_units: true
  observed_real_sensor_outage: false
  simulated_sensor_dropout_only: true
  confirmatory_claim_allowed: false
  row_level_inference_allowed: false
  external_code_execution_required: false
  publisher_reconstructed_tcp_allowed: false
  held_out_full_recording_clock_calibration: true
  offline_transductive_preparation: true
  acausal_preparation: true
  causal_or_online_claim_allowed: false
