preprocessing:
  grid_hz: 100
  active_trace_only: true
  quiet_prefix_samples: 20
  quiet_prefix_max_axis_std_rad_s: 0.01
  gyro_correction: subtract_quiet_prefix_axis_mean
  imu_clock_fit: deterministic_huber_irls_time_on_index
  imu_clock_fit_iterations: 8
  imu_clock_slope_min_us_per_index: 9500.0
  imu_clock_slope_max_us_per_index: 10500.0
  imu_clock_residual_max_us: 50000.0
  target_interpolation: linear_on_source_aligned_robot_time
  feature_interpolation: linear_on_robust_imu_index_time
  allow_extrapolation: false

alignment:
  source: publisher_nested_tar_robot_segment_aligned_time
  construction: madgwick_cal_imu_orientation_to_robot_joint_orientation_affine
  label_assisted: true
  fixed_before_model_results: true
  per_model_or_prediction_realign_allowed: false
  aligned_clock_slope_min_us_per_robot_s: 995000.0
  aligned_clock_slope_max_us_per_robot_s: 1005000.0
  aligned_clock_fit_residual_max_us: 1.0
  sensitivity_recipe:
    stage: downstream_evaluation_required
    preparation_executes_recipe: false
    signed_target_shifts_ms:
      - -50
      - -20
      - -10
      - 10
      - 20
      - 50
    zero_shift_baseline_required: true
    sign_convention: target_lookup_time_us_equals_base_aligned_time_us_plus_shift_ms_times_1000
    positive_shift_meaning: sample_target_later_than_the_base_prediction_time
    no_extrapolation: true
    edge_policy: drop_base_rows_without_shifted_target_support
    pairing_key: row_uid
    same_base_uid_pairing_required: true
    reporting_granularity: per_signed_shift_per_outer_fold_and_family_summary
    reporting_fold_families:
      - scenario_loso
      - speed_pair_out
      - shape_out
    primary_scenario_loso_folds: 8
    stress_reporting_required: true
    required_metrics:
      - rmse3d_m
      - robust_J_m
      - delta_rmse3d_m_shift_minus_zero
      - delta_robust_J_m_shift_minus_zero
    metric_definitions:
      rmse3d_m: sqrt_mean_squared_euclidean_tcp_xyz_error_in_metres
      robust_J_m: arithmetic_mean_of_A_mean_context_WS_worst_segment_and_WM_worst_mask_rmse3d_m
      shift_delta: signed_shift_metric_minus_zero_shift_metric_on_same_base_uid_pairs
    reporting_methods:
      - frozen_comparator
      - frozen_objective
    paired_method_delta_required: true
    paired_method_delta_sign: frozen_objective_minus_frozen_comparator
    model_selection_use_allowed: false
    claim_gate_use_allowed: false

