  observed_physical_outage_claim: forbidden
  online_control_or_deployment_claim: forbidden
  same_recording_public_benchmark_only: true
  outages_are_synthetic_masks_over_measured_complete_imu_streams: true
  all_methods_are_known_components_or_fixed_combinations: true

