    regression_applicability_is_literature_supported_but_local_effect_is_empirical: true
  cagrad:
    applies_only_during_300_cooperative_updates_of_terminal_candidate: true
    ordered_tasks: [cardinality_1, cardinality_2, cardinality_3, cardinality_4]
    each_task: cardinality_risk_plus_0p1_times_common_mofe
    task_count: 4
    task_gradient_parameter_order: model_named_parameter_registration_order
    task_gradient_source_dtype: float32
    missing_parameter_gradient_action: fail_fit
    flatten_rule: contiguous_float32_per_parameter_then_concatenate_in_frozen_parameter_order
    transfer_and_cast_rule: one_detached_complete_vector_per_task_cuda_to_cpu_then_cast_once_to_float64
    gram_matrix_dtype_and_device: float64_cpu
    gram_matrix_rule: all_sixteen_ordered_dot_products
    g_mean: one_fourth_sum_four_ordered_task_gradients
    g_weighted: sum_simplex_weight_k_times_task_gradient_k
    c: 0.4
    epsilon: 1.0e-12
    dual_objective: dot_g_weighted_g_mean_plus_c_times_norm_g_mean_times_norm_g_weighted
    dual_optimization_direction: minimize
    solver: scipy.optimize.minimize_method_SLSQP
    solver_version_bound_by_requirements_lock: true
    simplex_initial_weights: [0.25, 0.25, 0.25, 0.25]
    simplex_bounds_each: [0.0, 1.0]
    simplex_equality: sum_weights_minus_one_equals_zero
    solver_jacobian: null
    solver_constraint_jacobian: null
    solver_tol_argument: null
    solver_callback: null
    solver_options: {maxiter: 100, ftol: 1.0e-12, disp: false}
    solver_success_must_be_exact_true: true
    solver_result_x_shape: [4]
    solver_x_and_fun_must_be_finite: true
    solver_bound_residual_max: 1.0e-10
    solver_simplex_residual_max: 1.0e-10
    no_fallback_clipping_or_second_solve: true
    failure_action: fail_fit
    final_direction: g_mean_plus_c_times_norm_g_mean_times_g_weighted_over_norm_g_weighted_plus_epsilon
    epsilon_scope: final_direction_norm_g_weighted_denominator_only
    gram_or_dual_objective_epsilon: forbidden
    zero_norm_shortcut: forbidden_still_run_solver_and_record_degenerate_case
    composite_gradient_dtype: float64
    final_cast_and_assignment: cast_complete_direction_once_to_float32_then_slice_in_frozen_parameter_order
    extra_direction_rescale: none
    autograd_traversal_order: cardinality_1_then_cardinality_2_then_cardinality_3_then_cardinality_4
