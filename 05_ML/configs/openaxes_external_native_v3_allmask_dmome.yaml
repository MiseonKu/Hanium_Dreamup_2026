    A sealed empirical protocol for parameter-matched four-IMU endpoint
    regression under every nonempty availability subset, combining an
    output-space dynamic mixture of sensor experts, adjacent mask-lattice
    More-vs-Fewer calibration, and conflict-averse cardinality-risk gradients.
