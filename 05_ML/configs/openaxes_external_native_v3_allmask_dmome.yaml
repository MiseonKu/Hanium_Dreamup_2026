limitations:
  - One public UR5 recording with eight clustered scenarios is development evidence.
  - Synthetic masks do not establish robustness to physical sensor faults, drift, corruption, or timing failure.
  - Three seeds are paired optimization repeats, not independent experiments.
  - Parameter equality does not imply equal training compute or statistical capacity.
  - The two-stage contrast changes optimization path even with the same total update count.
  - No SO101 independent session, cross-installation, or closed-loop evidence exists.
