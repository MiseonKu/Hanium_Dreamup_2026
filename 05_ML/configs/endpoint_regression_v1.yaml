contract:
  name: alphaf.endpoint_regression.experiment.v1
  base_seed: 20260818
  research_status: exploratory_v1
  parent_contract: alphaf.ml_preparation.v1
  label_frame: vive_world
  label_unit: mm
  independent_test_available: false

release:
  archive: ../06_simulation_and_data_collect_preparation/imu_added_experiment/ml_preparation_v1.zip
  archive_sha256: 94deccb960b0554fb9a683875d36ef5726afc825d4b4ea244a1490f3353b1930
  expected_contract: alphaf.ml_preparation.v1
  expected_canonical_rows: 7707
  expected_train_eligible_rows: 7702
  expected_strict_qc_rows: 7670
  require_manifest_checksums: true
  reject_lfs_pointer: true

splits:
  schemes:
    segment_loso:
      role: primary
      outer_groups: [36, 37, 38, 39, 40]
      inner_policy: each_remaining_group_once
      outer_contexts: 5
      inner_contexts: 20
    target_group:
      role: secondary
      outer_groups: [0, 1, 2, 3, 4]
      group_rule: "int(target_id[1:]) % 5"
      expected_targets_per_group: 10
      inner_policy: each_remaining_group_once
      outer_contexts: 5
      inner_contexts: 20
  expected_contexts: 50
  expected_assignment_rows: 385100
  validation_and_test_real_only: true

features:
  label_columns:
    - vive_pos_raw_x_mm
    - vive_pos_raw_y_mm
    - vive_pos_raw_z_mm
  primary_views:
    encoder: encoder_only_v1
    four_imu: four_imu_endpoint_v1
    fusion: fusion_v1
  diagnostic_views:
    planned_only: planned_only_v1
    fusion_planned: command_context_ablation_v1
    fusion_mag: mag_ablation_v1
  forbidden_primary_tokens:
    - vive
    - tracker
    - target_id
    - segment
    - timestamp
    - qc
    - planned
    - provenance

experiment_matrix:
  baseline:
    models: [dummy_mean]
    feature_views: [none]
    recipes: [real_only]
  sensor_comparison:
    models: [ridge, extra_trees, xgboost, mlp]
    feature_views: [encoder, four_imu, fusion]
    recipes: [real_only]
  augmentation_comparison:
    models: [ridge, extra_trees, xgboost, mlp]
    feature_views: [fusion]
    recipes: [real_only, replay, local_interp_v2, cmixup_offline_v1]
  shortcut_diagnostics:
    models: [ridge, extra_trees]
    feature_views: [planned_only, fusion_planned, fusion_mag]
    recipes: [real_only]
  deployment_exclusions:
    models: [dummy_mean]
    recipes: [replay]
    feature_views: [planned_only, fusion_planned, fusion_mag]

models:
  dummy_mean:
    strategy: train_fold_mean
  ridge:
    alpha: [0.1, 1.0, 10.0, 100.0]
    scale_features: true
  extra_trees:
    n_estimators: 400
    max_features: [0.5, 1.0]
    min_samples_leaf: [1, 4]
    n_jobs: 1
  xgboost:
    output_strategy: independent_xyz
    n_estimators: 500
    learning_rate: 0.05
    max_depth: [4, 8]
    min_child_weight: [1.0, 5.0]
    reg_lambda: [1.0, 10.0]
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: hist
    n_jobs: 1
  mlp:
    output_strategy: shared_xyz
    hidden_layer_sizes:
      - [64, 64]
      - [128, 64]
    alpha: [0.0001, 0.001]
    activation: relu
    solver: adam
    batch_size: 128
    ensemble_seed_count: 3
    scale_features: true
    early_stopping: false

preprocessing:
  fit_scope: real_train_only
  feature_scaling_models: [ridge, mlp]
  target_center: train_xyz_mean
  target_scale: one_isotropic_scale
  preserve_axis_weighting: true

recipes:
  real_only:
    real_weight: 1.0
    added_weight: 0.0
    epoch_budget: 400
  replay:
    source: duplicate_real_train_once
    real_weight: 0.5
    added_weight: 0.5
    epoch_budget: 200
  local_interp_v2:
    source: regenerate_from_context_real_train
    ratio: 1.0
    real_weight: 0.5
    added_weight: 0.5
    epoch_budget: 200
  cmixup_offline_v1:
    source: regenerate_from_context_real_train
    ratio: 1.0
    real_weight: 0.5
    added_weight: 0.5
    epoch_budget: 200
  outer_refit_materialized_from_release: true

selection:
  score: macro_group_rmse_3d_mm
  aggregate: equal_group_mean
  parameter_tie_tolerance: 1.0e-12
  model_priority: [ridge, extra_trees, xgboost, mlp]
  recipe_priority: [real_only, local_interp_v2, cmixup_offline_v1]
  hyperparameter_priority:
    ridge_alpha: [100.0, 10.0, 1.0, 0.1]
    extra_trees_max_features: [0.5, 1.0]
    extra_trees_min_samples_leaf: [4, 1]
    xgboost_max_depth: [4, 8]
    xgboost_min_child_weight: [5.0, 1.0]
    xgboost_reg_lambda: [10.0, 1.0]
    mlp_hidden_layer_sizes:
      - [64, 64]
      - [128, 64]
    mlp_alpha: [0.001, 0.0001]

metrics:
  primary: rmse_3d_mm
  legacy_axis_pooled_name: rmse_xyz_mm
  verify_rmse_relation: true
  pooled_error_quantiles: [0.5, 0.9, 0.95]
  per_axis: [bias, mae, rmse, r2]
  cell_balance_factors: [segment_id, target_id]
  report_seed_variability: true

augmentation_gate:
  comparison_feature_view: fusion
  baseline_recipe: real_only
  minimum_relative_rmse_improvement: 0.10
  minimum_absolute_rmse_improvement_mm: 3.0
  maximum_relative_p95_degradation: 0.05
  require_both_improvement_thresholds_via_max: true

uncertainty:
  method: deterministic_multiway_bootstrap
  replicates: 10000
  cluster_factors: [segment_id, target_id]
  confidence_level: 0.95
  report_p_values: false

strict_qc:
  locked_oof_subset_analysis: true
  final_candidate_strict_only_refit: true
  select_on_strict_qc: false

final_model:
  selection_scheme: segment_loso
  selection_contexts: 20
  allow_only_gate_passing_augmentation: true
  fallback_recipe: real_only
  train_on_all_eligible_real: true
  regenerate_selected_augmentation_ratio: 1.0
  independent_test_score_available: false

runtime:
  default_jobs: 4
  estimator_threads: 1
  deterministic_context_hash_seeds: true
  atomic_resume: true
  refuse_task_or_config_hash_mismatch: true

outputs:
  prediction_columns:
    - pred_vive_world_x_mm
    - pred_vive_world_y_mm
    - pred_vive_world_z_mm
  inference_optional_columns: [row_id]
  include_model_hash: true
  include_frame_and_unit: true
