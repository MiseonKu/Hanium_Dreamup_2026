robot:
  name: so101_flex_3dof
  dof: 3
  link_length_preset: SO101_AB_current
  link_lengths_mm:
    A: 233.0
    B: 215.0
  use_c_link: false
  tracker_offset_mm: [0.0, 0.0]
  q_init_rad: [0.0, 1.5707963267948966, -1.5707963267948966]

material:
  preset: TPU95A_40x12_wall4_topbottom4_infill15_honeycomb
  wall_count: 4
  top_bottom_wall_count: 4
  infill_percent: 15
  infill_type: honeycomb
  cross_section_mm: [40.0, 12.0]
  weak_axis_bending: 12mm_thickness_direction

flex_model:
  k1: 0.0
  k2: 0.0
  max_delta_rad: 0.35
  bending_score_weights: [1.0, 1.0, 1.0]

joint_limits_rad:
  q1: [-2.5, 2.5]
  q2: [-1.8, 1.8]
  q3: [-2.2, 2.2]

sampling:
  n_candidates: 100000
  n_targets: 500
  repeats_per_point: 3
  random_seed: 42
  latin_hypercube: true
  azimuth_bins: 4
  min_joint_margin_rad: 0.05
  min_singularity_score: 0.05
  max_d_flex_mm: 80.0
  floor_min_z_mm: -300.0
  round_trip_epsilon_mm: 3.0
  validate_round_trip: true

trajectory:
  type: minimum_jerk
  duration_sec: 2.0
  dt_sec: 0.01
  speed_scale: 1.0

ik:
  tolerance_mm: 3.0
  max_iter: 30
  damping_lambda: 0.05
  finite_difference_eps: 1e-5
  max_step_rad: 0.25
